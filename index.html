<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuicyZip - Ultimate Fruit Juice</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Background image container fixed to full screen */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Website content container layout */
        .content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* Navigation bar styling */
        nav {
            background: rgba(10, 34, 64, 0.75);
            backdrop-filter: blur(5px);
            padding: 15px 0;
            width: 100%;
        }

        .nav-links {
            list-style-type: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .nav-links li a {
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .nav-links li a:hover {
            color: #ffcc00;
        }

        /* Main hero section */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Centered logo container */
        .logo-container {
            max-width: 550px;
            width: 90%;
            margin-bottom: 20px;
        }

        .logo-image {
            width: 100%;
            height: auto;
            filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.4));
        }

        /* Tagline styling */
        .tagline {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: 600;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
        }

        /* Button styling */
        .cta-button {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #0a2240;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #ffd633, #ffaa00);
        }

        /* Mobile responsive adjustments */
        @media (max-width: 768px) {
            .nav-links {
                gap: 15px;
            }
            .nav-links li a {
                font-size: 14px;
            }
            .tagline {
                font-size: 16px;
            }
            .logo-container {
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <!-- Background JPEG image -->
    <div class="background-container">
        <img src="background.jpg" alt="JuicyZip Background" class="bg-image">
    </div>

    <!-- Main website content -->
    <div class="content">
        <nav>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <main class="hero-section">
            <div class="logo-container">
                <!-- Center Logo Image -->
                <img src="logo.jpeg" alt="JuicyZip Logo" class="logo-image">
            </div>
            
            <p class="tagline">Sparkle, Refresh, Repeat! Experience the ultimate fruit juice.</p>
            
            <button class="cta-button">Explore Flavours</button>
        </main>
    </div>

</body>
</html>
